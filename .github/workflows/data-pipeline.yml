name: Data Pipeline

on:
  schedule:
    # Source cadence: the ABS publishes the Consumer Price Index QUARTERLY
    # (late Jan / Apr / Jul / Oct). Proportional cron = quarterly, run the month
    # AFTER each release (Feb / May / Aug / Nov) on a staggered day + off-hour.
    - cron: '23 6 8 2,5,8,11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node pipeline/collect.mjs
      - run: node pipeline/aggregate.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update CPI data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
